name: masar
description: Masar – Navi für Saudi-Arabien mit Fahrspur-Assistent.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^7.0.2        # Karte (OpenStreetMap-Kacheln)
  latlong2: ^0.9.1           # Koordinaten
  geolocator: ^13.0.1        # echtes GPS
  flutter_tts: ^4.2.0        # Sprachansagen (DE/EN/AR)
  http: ^1.2.2               # Routing (OSRM) & Geocoding (Nominatim)
  # später: here_sdk (3D-Kreuzungen/Live-Verkehr), supabase_flutter (Konten/Community)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Gebündelte Schriften: DejaVu Sans (Latein/Ziffern) + Noto Naskh Arabic (Arabisch).
  # Wichtig, weil das System-Roboto keine arabischen Glyphen enthält – so ist
  # Arabisch auf allen Geräten und offline garantiert. Später gegen z. B. Cairo tauschbar.
  fonts:
    - family: AppSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
    - family: NotoArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
