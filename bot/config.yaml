exchange:
  name: binance
  testnet: false            # false = kostenlose Live-Public-Daten (Mainnet, keine Keys nötig für OHLCV/Ticker)
  markets: [spot]

universe:
  symbols:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - XRP/USDT
    - ADA/USDT
    - AVAX/USDT
    - LINK/USDT
  timeframes: [5m, 15m, 1h, 4h, 1d]
  primary_timeframe: 15m

engine:
  loop_interval_seconds: 30
  warmup_candles: 500
  parallel_scans: 16

risk:
  account_currency: USDT
  risk_per_trade_pct: 1.0
  max_open_positions: 5
  max_daily_loss_pct: 4.0
  max_drawdown_pct: 15.0
  atr_stop_multiplier: 2.0
  take_profit_r_multiple: [1.5, 2.5, 4.0]
  trail_after_r: 1.0

strategies:
  ema_cross:            { enabled: true,  weight: 1.0, fast: 20, slow: 50, trend_filter_ema: 200 }
  macd_trend:           { enabled: true,  weight: 1.0, fast: 12, slow: 26, signal: 9 }
  rsi_meanrev:          { enabled: true,  weight: 0.7, period: 14, oversold: 28, overbought: 72 }
  bollinger_squeeze:    { enabled: true,  weight: 0.8, period: 20, stdev: 2.0, squeeze_lookback: 120 }
  donchian_breakout:    { enabled: true,  weight: 1.0, period: 55, exit_period: 20 }
  vwap_reversion:       { enabled: true,  weight: 0.6, stdev_bands: [1.5, 2.5] }
  mmcrypto_style:       { enabled: true,  weight: 1.4, higher_tf: 4h, ema_htf: 200, ema_ltf_fast: 21, ema_ltf_slow: 55, rsi_period: 14, volume_lookback: 20, volume_multiplier: 1.5 }
  mega_confluence:      { enabled: true,  weight: 1.6, agreement_pct: 0.70 }

  # trader personas
  soros_reflexivity:    { enabled: true,  weight: 1.3 }
  buffett_value:        { enabled: true,  weight: 1.2 }
  ptj_crash:            { enabled: true,  weight: 1.3 }
  paulson_bubble:       { enabled: true,  weight: 1.3 }
  livermore_pivot:      { enabled: true,  weight: 1.1, pivot_lookback: 60 }
  einhorn_bear:         { enabled: true,  weight: 1.0 }
  dalio_allweather:     { enabled: true,  weight: 1.0 }
  templeton_pessimism:  { enabled: true,  weight: 1.1 }
  tepper_distressed:    { enabled: true,  weight: 1.2 }
  ackman_conviction:    { enabled: true,  weight: 1.5 }

ensemble:
  min_score: 2.0
  agreement_required: 2

logging:
  level: INFO
  file: logs/bot.log
